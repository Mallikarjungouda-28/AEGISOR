[build]
  publish = "frontend/dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy /api requests to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Health check route
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200
  force = true

